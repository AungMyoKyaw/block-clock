name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (aarch64)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh aarch64-apple-darwin
      - run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "target/aarch64-apple-darwin/release/Block Clock.app" "dist/block-clock-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: block-clock-macos-arm64
          path: dist/block-clock-macos-arm64.zip

  build-macos-x64:
    name: macOS Intel (x86_64)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh x86_64-apple-darwin
      - run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "target/x86_64-apple-darwin/release/Block Clock.app" "dist/block-clock-macos-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: block-clock-macos-x64
          path: dist/block-clock-macos-x64.zip

  build-windows-x64:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item target/release/block-clock.exe dist/stage/
          Copy-Item README.md, LICENSE dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath dist/block-clock-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: block-clock-windows-x64
          path: dist/block-clock-windows-x64.zip

  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: |
          mkdir -p dist/block-clock-linux-x64
          cp target/release/block-clock dist/block-clock-linux-x64/
          cp packaging/linux/block-clock.desktop dist/block-clock-linux-x64/
          cp assets/app-icon.png dist/block-clock-linux-x64/block-clock.png
          cp README.md LICENSE dist/block-clock-linux-x64/
          tar -C dist -czf dist/block-clock-linux-x64.tar.gz block-clock-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: block-clock-linux-x64
          path: dist/block-clock-linux-x64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64, build-linux-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
